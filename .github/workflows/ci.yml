name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Configure pinned Node
        run: printf 'NODE_BIN=%s\n' "$(command -v node)" > .env.node
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build:web
